<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DJ Legends: Techno vs EDM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #12121a; font-family: 'Courier New', monospace; color: #fff; }
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #1a1a24; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #1a1a28; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    
    #touch-controls { position: absolute; bottom: 10px; left: 0; width: 100%; height: 160px; pointer-events: none; z-index: 50; display: none; }
    .touch-btn { position: absolute; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #fff; font-size: 1.2rem; -webkit-tap-highlight-color: transparent; }
    .touch-btn:active { background: rgba(0,255,204,0.6); border-color: #00ffcc; color: #000; }
    
    #dpad { position: absolute; bottom: 15px; left: 15px; width: 130px; height: 130px; }
    #btn-up { top: 0; left: 45px; width: 40px; height: 40px; }
    #btn-down { bottom: 0; left: 45px; width: 40px; height: 40px; }
    #btn-left { top: 45px; left: 0; width: 40px; height: 40px; }
    #btn-right { top: 45px; right: 0; width: 40px; height: 40px; }
    
    #actions { position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px; }
    #btn-punch { bottom: 10px; right: 100px; width: 50px; height: 50px; background: rgba(0,255,204,0.3); }
    #btn-kick { bottom: 50px; right: 50px; width: 50px; height: 50px; background: rgba(255,0,85,0.3); }
    #btn-special { bottom: 0px; right: 0px; width: 45px; height: 45px; background: rgba(255,204,0,0.3); font-size: 0.8rem; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <!-- Touch Controls -->
    <div id="touch-controls">
      <div id="dpad">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-left">◄</div>
        <div class="touch-btn" id="btn-right">►</div>
      </div>
      <div id="actions">
        <div class="touch-btn" id="btn-punch">P</div>
        <div class="touch-btn" id="btn-kick">K</div>
        <div class="touch-btn" id="btn-special">SP</div>
      </div>
    </div>
  </div>

  <script>
    var audioCtx = null;
    var bgmInterval = null;

    function initAudio() {
      if (!audioCtx) {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioCtx = new AudioCtx();
        } catch(e){}
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        try { audioCtx.resume(); } catch(e){}
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        var t = audioCtx.currentTime;

        if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, t);
          osc.frequency.exponentialRampToValueAtTime(30, t + 0.1);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
          osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'special') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(90, t);
          osc.frequency.exponentialRampToValueAtTime(600, t + 0.3);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
          osc.start(t); osc.stop(t + 0.3);
        } else if (type === 'pickup') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, t);
          osc.frequency.setValueAtTime(1000, t + 0.08);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
          osc.start(t); osc.stop(t + 0.2);
        }
      } catch(e){}
    }

    function startMusic() {
      if (bgmInterval || !audioCtx) return;
      var notes = [110, 110, 220, 110, 146.83, 110, 130.81, 110];
      var step = 0;
      bgmInterval = setInterval(function() {
        if (!audioCtx) return;
        try {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.value = notes[step % notes.length];
          gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.1);
          step++;
        } catch(e){}
      }, 140);
    }

    function stopMusic() {
      if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
    }

    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas ? canvas.getContext('2d') : null;
    var selectedCharKey = 'ricardo';
    var gameState = 'TITLE'; // TITLE, PLAYING, GAMEOVER, VICTORY
    var cameraX = 0;
    var stageWidth = 2600;
    var keys = {};

    window.addEventListener('keydown', function(e) { initAudio(); keys[e.code] = true; });
    window.addEventListener('keyup', function(e) { keys[e.code] = false; });

    var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (isTouchDevice) {
      var tc = document.getElementById('touch-controls');
      if (tc) tc.style.display = 'block';
    }

    function setupTouch(id, code) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('touchstart', function(e) { e.preventDefault(); initAudio(); keys[code] = true; });
      el.addEventListener('touchend', function(e) { e.preventDefault(); keys[code] = false; });
    }
    setupTouch('btn-up', 'KeyW');
    setupTouch('btn-down', 'KeyS');
    setupTouch('btn-left', 'KeyA');
    setupTouch('btn-right', 'KeyD');
    setupTouch('btn-punch', 'KeyJ');
    setupTouch('btn-kick', 'KeyK');
    setupTouch('btn-special', 'KeyL');

    var CHAR_DATA = {
      ricardo: { name: 'Ricardo Villalobos', hp: 999, speed: 3.8, power: 25 },
      richie:  { name: 'Richie Hawtin', hp: 999, speed: 4.6, power: 22 },
      derrick: { name: 'Derrick May', hp: 999, speed: 3.2, power: 30 }
    };

    var player = null;
    function Player(type) {
      var data = CHAR_DATA[type];
      this.type = type;
      this.name = data.name;
      this.x = 100; this.y = 340;
      this.hp = data.hp; this.maxHp = data.hp;
      this.speed = data.speed; this.power = data.power;
      this.facing = 1; this.state = 'idle';
      this.animTimer = 0; this.attackBox = null;
      this.invulnerableTimer = 0;
    }

    Player.prototype.update = function() {
      if (this.invulnerableTimer > 0) this.invulnerableTimer--;

      if (this.state === 'hurt') {
        this.animTimer++;
        if (this.animTimer > 8) { this.state = 'idle'; this.animTimer = 0; }
        return;
      }
      if (this.state === 'punch' || this.state === 'kick' || this.state === 'special') {
        this.animTimer++;
        if (this.animTimer > 10) { this.state = 'idle'; this.animTimer = 0; this.attackBox = null; }
        return;
      }

      var dx = 0, dy = 0;
      if (keys['KeyA'] || keys['ArrowLeft'])  { dx -= this.speed; this.facing = -1; }
      if (keys['KeyD'] || keys['ArrowRight']) { dx += this.speed; this.facing = 1; }
      if (keys['KeyW'] || keys['ArrowUp'])    { dy -= this.speed * 0.6; }
      if (keys['KeyS'] || keys['ArrowDown'])  { dy += this.speed * 0.6; }

      this.x = Math.max(30, Math.min(stageWidth - 30, this.x + dx));
      this.y = Math.max(290, Math.min(420, this.y + dy));

      if (this.x - cameraX > 500 && cameraX < stageWidth - 800) { cameraX = this.x - 500; }
      else if (this.x - cameraX < 150 && cameraX > 0) { cameraX = this.x - 150; }

      if (keys['KeyJ']) {
        this.state = 'punch'; this.animTimer = 0; playSound('hit');
        this.attackBox = { x: this.x + (this.facing * 45), y: this.y - 40, w: 60, h: 45, dmg: this.power };
      } else if (keys['KeyK']) {
        this.state = 'kick'; this.animTimer = 0; playSound('hit');
        this.attackBox = { x: this.x + (this.facing * 55), y: this.y - 40, w: 70, h: 45, dmg: this.power * 1.5 };
      } else if (keys['KeyL']) {
        this.state = 'special'; this.animTimer = 0; playSound('special');
        this.attackBox = { x: this.x - 100, y: this.y - 70, w: 200, h: 100, dmg: this.power * 3 };
      }
    };

    Player.prototype.draw = function() {
      if (!ctx) return;
      if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 3) % 2 === 0) return;

      ctx.save();
      ctx.translate(this.x - cameraX, this.y);

      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath(); ctx.ellipse(0, 0, 24, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.scale(this.facing, 1);

      if (this.type === 'ricardo') {
        ctx.fillStyle = '#2b2b48'; ctx.fillRect(-14, -58, 28, 38);
        ctx.fillStyle = '#ff0055'; ctx.fillRect(-4, -54, 8, 12);
        ctx.fillStyle = '#333352'; ctx.fillRect(-11, -20, 10, 20); ctx.fillRect(1, -20, 10, 20);
        ctx.fillStyle = '#e5b887'; ctx.fillRect(-9, -76, 18, 19);
        ctx.fillStyle = '#0d0d0d'; ctx.fillRect(-13, -80, 26, 14);
        ctx.fillRect(-15, -72, 8, 32); ctx.fillRect(7, -72, 8, 32);
      } else if (this.type === 'richie') {
        ctx.fillStyle = '#181818'; ctx.fillRect(-12, -58, 24, 38);
        ctx.fillStyle = '#111'; ctx.fillRect(-10, -20, 9, 20); ctx.fillRect(1, -20, 9, 20);
        ctx.fillStyle = '#f2c49b'; ctx.fillRect(-8, -74, 16, 17);
        ctx.fillStyle = '#050505'; ctx.fillRect(-7, -70, 14, 5);
        ctx.fillStyle = '#f4d03f'; ctx.fillRect(-9, -82, 18, 10); ctx.fillRect(2, -88, 10, 8);
      } else if (this.type === 'derrick') {
        ctx.fillStyle = '#4a7c59'; ctx.fillRect(-14, -58, 28, 38);
        ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-11, -20, 10, 20); ctx.fillRect(1, -20, 10, 20);
        ctx.fillStyle = '#6b4423'; ctx.fillRect(-9, -76, 18, 19);
        ctx.fillStyle = '#111'; ctx.fillRect(-10, -80, 20, 7);
        ctx.fillStyle = '#00ffcc'; ctx.fillRect(-8, -71, 16, 5);
      }
      ctx.restore();
    };

    var enemies = [], projectiles = [], chests = [], pickups = [];

    function Enemy(x, y, type) {
      this.x = x; this.y = y; this.type = type;
      this.facing = -1; this.timer = 0; this.knockback = 0;
      if (type === 'grunt') { this.hp = 25; this.maxHp = 25; this.speed = 1.4; this.power = 3; }
      else if (type === 'guetta') { this.hp = 40; this.maxHp = 40; this.speed = 1.2; this.power = 4; }
      else if (type === 'boss') { this.hp = 200; this.maxHp = 200; this.speed = 1.6; this.power = 8; }
    }

    Enemy.prototype.update = function() {
      if (this.hp <= 0) return;
      if (this.knockback !== 0) {
        this.x += this.knockback;
        this.knockback *= 0.8;
        if (Math.abs(this.knockback) < 0.5) this.knockback = 0;
        return;
      }

      var dist = Math.hypot(player.x - this.x, player.y - this.y);
      this.facing = (player.x > this.x) ? 1 : -1;

      if (dist > 60) {
        this.x += this.facing * this.speed;
        if (player.y > this.y) this.y += 0.4; else if (player.y < this.y) this.y -= 0.4;
      } else {
        this.timer++;
        if (this.timer > (this.type === 'boss' ? 50 : 70)) {
          this.timer = 0;
          if (this.type === 'boss' || this.type === 'guetta') {
