<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DJ Legends: Techno vs EDM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050508; font-family: 'Courier New', monospace; color: #fff; }
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #0b0b12; }
    
    /* Overlay Screens */
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(5,5,10,0.92); z-index: 10; text-align: center; padding: 20px; }
    .hidden { display: none !important; }
    
    h1 { font-size: 3rem; text-transform: uppercase; letter-spacing: 4px; color: #00ffcc; text-shadow: 0 0 15px #00ffcc, 3px 3px 0px #ff0055; margin-bottom: 10px; }
    h2 { font-size: 1.5rem; color: #ff0055; text-shadow: 0 0 10px #ff0055; margin-bottom: 25px; }
    p { font-size: 1rem; color: #aaa; max-width: 600px; margin-bottom: 20px; line-height: 1.4; }
    
    /* Character Selection Grid */
    .char-select { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
    .char-card { background: #121220; border: 3px solid #333; border-radius: 8px; padding: 15px; width: 180px; cursor: pointer; transition: all 0.2s ease; }
    .char-card:hover, .char-card.selected { border-color: #00ffcc; transform: translateY(-5px); box-shadow: 0 0 15px rgba(0,255,204,0.4); }
    .char-card h3 { color: #fff; margin-bottom: 5px; font-size: 1.2rem; }
    .char-card .sub { color: #ff0055; font-size: 0.8rem; margin-bottom: 10px; display: block; }
    .char-card .stats { font-size: 0.75rem; text-align: left; color: #ccc; }
    
    .btn { background: #ff0055; color: #fff; border: none; padding: 12px 30px; font-size: 1.2rem; font-weight: bold; font-family: inherit; text-transform: uppercase; cursor: pointer; border-radius: 4px; box-shadow: 0 0 10px #ff0055; transition: 0.2s; }
    .btn:hover { background: #00ffcc; color: #000; box-shadow: 0 0 15px #00ffcc; }
    
    /* Touch Controls Overlay */
    #touch-controls { position: absolute; bottom: 10px; left: 0; width: 100%; height: 160px; pointer-events: none; z-index: 5; display: none; }
    .touch-btn { position: absolute; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; font-weight: bold; color: rgba(255,255,255,0.8); font-size: 1.2rem; -webkit-tap-highlight-color: transparent; }
    .touch-btn:active { background: rgba(0,255,204,0.4); border-color: #00ffcc; color: #fff; }
    
    #dpad { position: absolute; bottom: 15px; left: 15px; width: 130px; height: 130px; }
    #btn-up { top: 0; left: 45px; width: 40px; height: 40px; }
    #btn-down { bottom: 0; left: 45px; width: 40px; height: 40px; }
    #btn-left { top: 45px; left: 0; width: 40px; height: 40px; }
    #btn-right { top: 45px; right: 0; width: 40px; height: 40px; }
    
    #actions { position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px; }
    #btn-punch { bottom: 10px; right: 100px; width: 50px; height: 50px; background: rgba(0,255,204,0.2); }
    #btn-kick { bottom: 50px; right: 50px; width: 50px; height: 50px; background: rgba(255,0,85,0.2); }
    #btn-special { bottom: 0px; right: 0px; width: 45px; height: 45px; background: rgba(255,204,0,0.2); font-size: 0.8rem; }
  </style>
</head>
