<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DJ Legends Test Directo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; }
    canvas { background: #1a1a2e; border: 4px solid #00ffcc; max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="800" height="450"></canvas>

  <script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    var contador = 0;

    function loop() {
      contador++;
      
      // Fondo azul oscuro del canvas
      ctx.fillStyle = '#121220';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Texto de prueba
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 30px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('¡MOTOR JS FUNCIONANDO!', canvas.width / 2, 140);

      ctx.fillStyle = '#ff0055';
      ctx.font = 'bold 18px Courier New';
      ctx.fillText('Fotogramas: ' + contador, canvas.width / 2, 240);

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
