<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DJ Legends: Techno vs EDM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #12121a; font-family: 'Courier New', monospace; color: #fff; display: flex; justify-content: center; align-items: center; }
    
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #1a1a24; }
    
    canvas { background: #1a1a28; max-width: 100%; max-height: 100%; cursor: pointer; -webkit-tap-highlight-color: transparent; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    
    #touch-controls { position: absolute; bottom: 10px; left: 0; width: 100%; height: 160px; pointer-events: none; z-index: 50; display: none; }
    .touch-btn { position: absolute; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #fff; font-size: 1.2rem; -webkit-tap-highlight-color: transparent; }
    .touch-btn:active { background: rgba(0,255,204,0.6); border-color: #00ffcc; color: #000; }
    
    #dpad { position: absolute; bottom: 15px; left: 15px; width: 130px; height: 130px; }
    #btn-up { top: 0; left: 45px; width: 40px; height: 40px; }
    #btn-down { bottom: 0; left: 45px; width: 40px; height: 40px; }
    #btn-left { top: 45px; left: 0; width: 40px; height: 40px; }
    #btn-right { top: 45px; right: 0; width: 40px; height: 40px; }
    
    #actions { position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px; }
    #btn-punch { bottom: 10px; right: 100px; width: 50px; height: 50px; background: rgba(0,255,204,0.3); }
    #btn-kick { bottom: 50px; right: 50px; width: 50px; height: 50px; background: rgba(255,0,85,0.3); }
    #btn-special { bottom: 0px; right: 0px; width: 45px; height: 45px; background: rgba(255,204,0,0.3); font-size: 0.8rem; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="touch-controls">
      <div id="dpad">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-left">◄</div>
        <div class="touch-btn" id="btn-right">►</div>
      </div>
      <div id="actions">
        <div class="touch-btn" id="btn-punch">P</div>
        <div class="touch-btn" id="btn-kick">K</div>
        <div class="touch-btn" id="btn-special">SP</div>
      </div>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');

    var audioCtx = null;
    var bgmInterval = null;
    var gameState = 'TITLE';
    var cameraX = 0;
    var stageWidth = 3600;
    var keys = {};

    var selectedIndex = 0;
    var roster = [
      { name: 'Ricardo Villalobos', color: '#2b2b48', accent: '#00ffcc', desc: 'Minimal Groove' },
      { name: 'Derrick May', color: '#1b3a4b', accent: '#ff0055', desc: 'Detroit Techno' },
      { name: 'Richie Hawtin', color: '#212529', accent: '#ffcc00', desc: 'Acid Overlord' }
    ];

    var player = null;
    var enemies = [];
    var projectiles = [];
    var chests = [];
    var pickups = [];

    function initAudio() {
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx && !audioCtx) {
          audioCtx = new AudioCtx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch(e){}
    }

    function playSound(type) {
      initAudio();
      if (!audioCtx) return;
      try {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        var t = audioCtx.currentTime;

        if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, t);
          osc.frequency.exponentialRampToValueAtTime(30, t + 0.1);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
          osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'special') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(90, t);
          osc.frequency.exponentialRampToValueAtTime(600, t + 0.3);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
          osc.start(t); osc.stop(t + 0.3);
        } else if (type === 'pickup') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, t);
          osc.frequency.setValueAtTime(1000, t + 0.08);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
          osc.start(t); osc.stop(t + 0.2);
        }
      } catch(e){}
    }

    function startMusic() {
      initAudio();
      if (bgmInterval || !audioCtx) return;
      var notes = [110, 110, 220, 110, 146.83, 110, 130.81, 110];
      var step = 0;
      bgmInterval = setInterval(function() {
        if (!audioCtx) return;
        try {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          if (player && player.x > 2800) {
            osc.type = 'sawtooth';
            osc.frequency.value = (step % 2 === 0) ? 220 : 440;
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          } else {
            osc.type = 'square';
            osc.frequency.value = notes[step % notes.length];
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
          }
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.1);
          step++;
        } catch(e){}
      }, 130);
    }

    function stopMusic() {
      if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
    }

    function Player(data) {
      this.name = data.name;
      this.color = data.color;
      this.accent = data.accent;
      this.x = 100; this.y = 340;
      this.hp = 999; this.maxHp = 999;
      this.speed = 3.8; this.power = 25;
      this.facing = 1; this.state = 'idle';
      this.animTimer = 0; this.attackBox = null;
      this.hasHit = false;
      this.invulnerableTimer = 0;
    }

    Player.prototype.update = function() {
      if (this.invulnerableTimer > 0) this.invulnerableTimer--;

      if (this.state === 'hurt') {
        this.animTimer++;
        if (this.animTimer > 12) { this.state = 'idle'; this.animTimer = 0; }
        return;
      }
      if (this.state === 'punch' || this.state === 'kick' || this.state === 'special') {
        this.animTimer++;
        if (this.animTimer > 16) { this.state = 'idle'; this.animTimer = 0; this.attackBox = null; this.hasHit = false; }
        return;
      }

      var dx = 0, dy = 0;
      if (keys['KeyA'] || keys['ArrowLeft'])  { dx -= this.speed; this.facing = -1; }
      if (keys['KeyD'] || keys['ArrowRight']) { dx += this.speed; this.facing = 1; }
      if (keys['KeyW'] || keys['ArrowUp'])    { dy -= this.speed * 0.6; }
      if (keys['KeyS'] || keys['ArrowDown'])  { dy += this.speed * 0.6; }

      this.x = Math.max(30, Math.min(stageWidth - 30, this.x + dx));
      this.y = Math.max(290, Math.min(420, this.y + dy));

      if (this.x - cameraX > 500 && cameraX < stageWidth - 800) { cameraX = this.x - 500; }
      else if (this.x - cameraX < 150 && cameraX > 0) { cameraX = this.x - 150; }

      if (keys['KeyJ']) {
        this.state = 'punch'; this.animTimer = 0; this.hasHit = false; playSound('hit');
        this.attackBox = { x: this.x + (this.facing * 55), y: this.y - 50, w: 75, h: 60, dmg: this.power };
      } else if (keys['KeyK']) {
        this.state = 'kick'; this.animTimer = 0; this.hasHit = false; playSound('hit');
        this.attackBox = { x: this.x + (this.facing * 65), y: this.y - 40, w: 85, h: 60, dmg: this.power * 1.5 };
      } else if (keys['KeyL']) {
        this.state = 'special'; this.animTimer = 0; this.hasHit = false; playSound('special');
        this.attackBox = { x: this.x - 120, y: this.y - 80, w: 240, h: 120, dmg: this.power * 3 };
      }
    };

    Player.prototype.draw = function() {
      if (!ctx) return;
      if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 3) % 2 === 0) return;

      ctx.save();
      ctx.translate(this.x - cameraX, this.y);
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath(); ctx.ellipse(0, 0, 24, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.scale(this.facing, 1);

      ctx.fillStyle = this.color; ctx.fillRect(-14, -58, 28, 38);
      ctx.fillStyle = this.accent; ctx.fillRect(-4, -54, 8, 12);
      ctx.fillStyle = '#333352'; ctx.fillRect(-11, -20, 10, 20); ctx.fillRect(1, -20, 10, 20);
      ctx.fillStyle = '#e5b887'; ctx.fillRect(-9, -76, 18, 19);
      ctx.fillStyle = '#0d0d0d'; ctx.fillRect(-13, -80, 26, 14);
      ctx.fillRect(-15, -72, 8, 32); ctx.fillRect(7, -72, 8, 32);

      if (this.state === 'punch') {
        ctx.fillStyle = this.accent;
        ctx.fillRect(8, -48, 26, 10);
      } else if (this.state === 'kick') {
        ctx.fillStyle = this.accent;
        ctx.fillRect(10, -18, 30, 10);
      } else if (this.state === 'special') {
        ctx.strokeStyle = this.accent; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, -40, 45, 0, Math.PI*2); ctx.stroke();
      }

      ctx.restore();
    };

    function Enemy(x, y, type) {
      this.x = x; this.y = y; this.type = type;
      this.facing = -1; this.timer = 0; this.knockback = 0;
      if (type === 'grunt') { this.hp = 25; this.maxHp = 25; this.speed = 1.4; this.power = 3; }
      else if (type === 'guetta') { this.hp = 40; this.maxHp = 40; this.speed = 1.2; this.power = 4; }
      else if (type === 'boss') { this.hp = 250; this.maxHp = 250; this.speed = 1.6; this.power = 8; }
    }

    Enemy.prototype.update = function() {
      if (this.hp <= 0 || !player) return;
      if (this.knockback !== 0) {
        this.x += this.knockback;
        this.knockback *= 0.8;
        if (Math.abs(this.knockback) < 0.5) this.knockback = 0;
        return;
      }

      var dist = Math.hypot(player.x - this.x, player.y - this.y);
      this.facing = (player.x > this.x) ? 1 : -1;

      if (dist > 60) {
        this.x += this.facing * this.speed;
        if (player.y > this.y) this.y += 0.4; else if (player.y < this.y) this.y -= 0.4;
      } else {
        this.timer++;
        if (this.timer > (this.type === 'boss' ? 50 : 70)) {
          this.timer = 0;
          if (this.type === 'boss' || this.type === 'guetta') {
            var pType = (this.type === 'boss') ? 'cake' : (Math.random() > 0.5 ? 'usb' : 'cdj');
            projectiles.push(new Projectile(this.x, this.y - 45, this.facing, pType));
          } else {
            if (Math.abs(player.y - this.y) < 25 && player.invulnerableTimer === 0) {
              player.hp -= this.power;
              player.state = 'hurt';
              player.invulnerableTimer = 60;
              playSound('hit');
            }
          }
        }
      }
    };

    Enemy.prototype.draw = function() {
      if (this.hp <= 0 || !ctx) return;
      ctx.save();
      ctx.translate(this.x - cameraX, this.y);
      ctx.scale(this.facing, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 8, 0, 0, Math.PI*2); ctx.fill();

      if (this.type === 'grunt') {
        ctx.fillStyle = '#222'; ctx.fillRect(-11, -54, 22, 35);
        ctx.fillStyle = '#fff'; ctx.fillRect(-3, -54, 6, 12);
        ctx.fillStyle = '#f2c49b'; ctx.fillRect(-8, -70, 16, 17);
        ctx.fillStyle = '#000'; ctx.fillRect(-7, -66, 14, 5);
      } else if (this.type === 'guetta') {
        ctx.fillStyle = '#2a6f97'; ctx.fillRect(-12, -55, 24, 36);
        ctx.fillStyle = '#f8edeb'; ctx.fillRect(-8, -71, 16, 17);
        ctx.fillStyle = '#e9c46a'; ctx.fillRect(-9, -78, 18, 8);
      } else if (this.type === 'boss') {
        ctx.scale(1.3, 1.3);
        ctx.fillStyle = '#d90429'; ctx.fillRect(-14, -58, 28, 40);
        ctx.fillStyle = '#e5b887'; ctx.fillRect(-9, -76, 18, 19);
        ctx.fillStyle = '#111'; ctx.fillRect(-15, -81, 30, 10);
        ctx.fillRect(-16, -72, 7, 36); ctx.fillRect(9, -72, 7, 36);
        ctx.fillRect(-7, -62, 14, 6);
      }

      ctx.scale(this.facing, 1);
      ctx.fillStyle = '#333'; ctx.fillRect(-24, -92, 48, 6);
      ctx.fillStyle = this.type === 'boss' ? '#ffcc00' : '#ff0055'; 
      ctx.fillRect(-24, -92, (this.hp / this.maxHp) * 48, 6);
      ctx.restore();
    };

    function Projectile(x, y, dir, type) {
      this.x = x; this.y = y; this.dir = dir; this.type = type;
      this.speed = 4.5; this.active = true;
    }

    Projectile.prototype.update = function() {
      if (!player) return;
      this.x += this.dir * this.speed;
      if (Math.abs(this.x - player.x) < 25 && Math.abs(this.y - (player.y - 30)) < 30 && player.invulnerableTimer === 0) {
        player.hp -= (this.type === 'cake' ? 10 : 6);
        player.state = 'hurt';
        player.invulnerableTimer = 60;
        playSound('hit');
        this.active = false;
      }
      if (Math.abs(this.x - player.x) > 650) this.active = false;
    };

    Projectile.prototype.draw = function() {
      if (!this.active || !ctx) return;
      ctx.save();
      ctx.translate(this.x - cameraX, this.y);
      if (this.type === 'cake') {
        ctx.fillStyle = '#fff'; ctx.fillRect(-14, -14, 28, 18);
        ctx.fillStyle = '#ff0055'; ctx.fillRect(-14, -7, 28, 5);
        ctx.fillStyle = '#ffcc00'; ctx.fillRect(-2, -20, 4, 7);
      } else if (this.type === 'usb') {
        ctx.fillStyle = '#00ffcc'; ctx.fillRect(-9, -5, 18, 10);
      } else if (this.type === 'cdj') {
        ctx.fillStyle = '#222'; ctx.fillRect(-15, -12, 30, 22);
        ctx.fillStyle = '#00ffcc'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    };

    function TreasureChest(x, y) {
      this.x = x; this.y = y; this.broken = false;
    }

    TreasureChest.prototype.draw = function() {
      if (!ctx) return;
      ctx.save();
      ctx.translate(this.x - cameraX, this.y);
      if (!this.broken) {
        ctx.fillStyle = '#3d405b'; ctx.fillRect(-24, -32, 48, 32);
        ctx.fillStyle = '#e0e1dd';
        ctx.fillRect(-24, -32, 48, 5); ctx.fillRect(-24, -5, 48, 5);
        ctx.fillRect(-24, -32, 5, 32); ctx.fillRect(19, -32, 5, 32);
        ctx.fillStyle = '#ffcc00'; ctx.fillRect(-6, -20, 12, 9);
      } else {
        ctx.fillStyle = '#1d1e2c'; ctx.fillRect(-24, -16, 48, 16);
        ctx.fillStyle = '#e0e1dd'; ctx.fillRect(-26, -26, 52, 6);
      }
      ctx.restore();
    };

    function PickupItem(x, y, type) {
      this.x = x; this.y = y; this.type = type; this.active = true;
    }

    PickupItem.prototype.update = function() {
      if (!player) return;
      if (Math.hypot(player.x - this.x, player.y - this.y) < 40) {
        player.hp = Math.min(player.maxHp, player.hp + 200);
        playSound('pickup'); this.active = false;
      }
    };

    PickupItem.prototype.draw = function() {
      if (!this.active || !ctx) return;
      ctx.save();
      ctx.translate(this.x - cameraX, this.y - 12);
      if (this.type === 'headphones') {
        ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, 12, Math.PI, 0); ctx.stroke();
        ctx.fillStyle = '#111'; ctx.fillRect(-15, -2, 7, 12); ctx.fillRect(8, -2, 7, 12);
      } else {
        ctx.fillStyle = '#ff0055'; ctx.fillRect(-7, -12, 14, 24);
        ctx.fillStyle = '#00ffcc'; ctx.fillRect(-7, -5, 14, 6);
      }
      ctx.restore();
    };

    function startActualGame(selectedRosterData) {
      initAudio();
      startMusic();

      player = new Player(selectedRosterData);
      enemies = [
        new Enemy(600, 340, 'grunt'),
        new Enemy(1000, 360, 'guetta'),
        new Enemy(1500, 330, 'grunt'),
        new Enemy(2000, 370, 'guetta'),
        new Enemy(2600, 350, 'grunt'),
        new Enemy(3300, 340, 'boss')
      ];

      chests = [
        new TreasureChest(800, 330),
        new TreasureChest(1750, 360),
        new TreasureChest(2800, 340)
      ];

      projectiles = [];
      pickups = [];
      cameraX = 0;
      gameState = 'PLAYING';
    }

    function handleScreenClick(clientX, clientWidth) {
      initAudio();
      if (gameState === 'TITLE') {
        gameState = 'SELECT';
      } else if (gameState === 'SELECT') {
        var third = clientWidth / 3;
        if (clientX < third) {
          selectedIndex = (selectedIndex - 1 + roster.length) % roster.length;
          playSound('pickup');
        } else if (clientX > third * 2) {
          selectedIndex = (selectedIndex + 1) % roster.length;
          playSound('pickup');
        } else {
          startActualGame(roster[selectedIndex]);
        }
      } else if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
        gameState = 'TITLE';
      }
    }

    function update() {
      if (gameState !== 'PLAYING' || !player) return;

      player.update();

      if (player.attackBox && !player.hasHit) {
        var hitSomething = false;
        enemies.forEach(function(e) {
          if (e.hp > 0) {
            // Colisión AABB ampliada para asegurar impacto de puñetazos, patadas y especiales
            var box = player.attackBox;
            var enemyLeft = e.x - 25;
            var enemyRight = e.x + 25;
            var enemyTop = e.y - 60;
            var enemyBottom = e.y;

            if (
              box.x < enemyRight &&
              box.x + box.w > enemyLeft &&
              box.y < enemyBottom &&
              box.y + box.h > enemyTop
            ) {
              e.hp -= box.dmg;
              e.knockback = player.facing * 8;
              playSound('hit');
              hitSomething = true;
            }
          }
        });

        chests.forEach(function(c) {
          if (!c.broken && Math.abs(c.x - player.attackBox.x) < 60) {
            c.broken = true;
            playSound('hit');
            pickups.push(new PickupItem(c.x, c.y, Math.random() > 0.5 ? 'drink' : 'headphones'));
            hitSomething = true;
          }
        });

        if (hitSomething) {
          player.hasHit = true;
        }
      }

      enemies.forEach(function(e) { e.update(); });
      projectiles.forEach(function(p) { p.update(); });
      pickups.forEach(function(p) { p.update(); });

      if (player.hp <= 0) {
        gameState = 'GAMEOVER';
        stopMusic();
      }

      var boss = null;
      for(var i=0; i<enemies.length; i++) {
        if (enemies[i].type === 'boss') { boss = enemies[i]; break; }
      }
      if (boss && boss.hp <= 0) {
        gameState = 'VICTORY';
        stopMusic();
      }
    }

    function drawStageBackground() {
      if (!ctx || !canvas) return;
      
      var isBossZone = player && player.x > 2800;

      ctx.fillStyle = isBossZone ? '#280a18' : '#1a1a2e'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var time = Date.now() * 0.002;

      ctx.strokeStyle = isBossZone ? 'rgba(255, 0, 85, 0.7)' : 'rgba(0, 255, 204, 0.45)'; 
      ctx.lineWidth = 18;
      ctx.beginPath(); ctx.moveTo(120 - cameraX * 0.2, 0); ctx.lineTo(Math.sin(time)*240 + 220 - cameraX * 0.2, 450); ctx.stroke();
      
      ctx.strokeStyle = isBossZone ? 'rgba(255, 204, 0, 0.7)' : 'rgba(255, 0, 85, 0.45)';
      ctx.beginPath(); ctx.moveTo(720 - cameraX * 0.2, 0); ctx.lineTo(Math.cos(time)*240 + 580 - cameraX * 0.2, 450); ctx.stroke();

      ctx.fillStyle = isBossZone ? '#1d1124' : '#2b2b48'; 
      ctx.fillRect(0, 270, canvas.width, 180);
      ctx.strokeStyle = isBossZone ? 'rgba(255, 0, 85, 0.3)' : 'rgba(0, 255, 204, 0.25)'; 
      ctx.lineWidth = 2;
      for (var x = 0; x < stageWidth; x += 60) {
        ctx.beginPath(); ctx.moveTo(x - cameraX, 270); ctx.lineTo(x - cameraX, 450); ctx.stroke();
      }

      ctx.fillStyle = isBossZone ? '#3d1226' : '#3a3a5c'; 
      ctx.fillRect(450 - cameraX * 0.5, 150, 280, 120);
      ctx.fillStyle = isBossZone ? '#ff0055' : '#00ffcc';
      for (var i = 0; i < 12; i++) {
        var h = Math.abs(Math.sin(time + i)) * 50 + 10;
        ctx.fillRect(470 + (i * 20) - cameraX * 0.5, 250 - h, 14, h);
      }

      if (isBossZone) {
        ctx.fillStyle = 'rgba(255, 0, 85, 0.8)';
        ctx.font = 'bold 16px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('⚠ ZONA DE COMBATE: STEVE AOKI ⚠', canvas.width / 2, 40);
      }
    }

    function drawHUD() {
      if (!ctx || !player) return;
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(15, 15, 260, 38);
      ctx.fillStyle = '#444'; ctx.fillRect(20, 20, 250, 28);
      ctx.fillStyle = player.hp > (player.maxHp * 0.3) ? '#00ffcc' : '#ff0055';
      ctx.fillRect(20, 20, (player.hp / player.maxHp) * 250, 28);

      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Courier New';
      ctx.fillText(player.name.toUpperCase() + ' HP: ' + Math.max(0, Math.ceil(player.hp)) + ' / ' + player.maxHp, 25, 38);
    }

    function drawTitleScreen() {
      ctx.fillStyle = 'rgba(10, 10, 18, 0.95)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 36px Courier New';
      ctx.fillText('DJ LEGENDS: TECHNO VS EDM', canvas.width / 2, 140);

      ctx.fillStyle = '#ff0055';
      ctx.font = 'bold 18px Courier New';
      ctx.fillText('HAZ CLIC O TOCA PARA EMPEZAR', canvas.width / 2, 230);

      ctx.fillStyle = '#888';
      ctx.font = '13px Courier New';
      ctx.fillText('Versión Underground 100% Autónoma', canvas.width / 2, 340);
    }

    function drawSelectScreen() {
      ctx.fillStyle = 'rgba(10, 10, 18, 0.95)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 28px Courier New';
      ctx.fillText('SELECCIONA TU LEYENDA TECHNO', canvas.width / 2, 50);

      var boxWidth = 200, boxHeight = 220;
      var startX = (canvas.width - (roster.length * 220)) / 2;

      for (var i = 0; i < roster.length; i++) {
        var bx = startX + (i * 220);
        var by = 100;

        ctx.fillStyle = (i === selectedIndex) ? '#222533' : '#14141c';
        ctx.strokeStyle = (i === selectedIndex) ? '#00ffcc' : '#444';
        ctx.lineWidth = (i === selectedIndex) ? 4 : 2;
        ctx.fillRect(bx, by, boxWidth, boxHeight);
        ctx.strokeRect(bx, by, boxWidth, boxHeight);

        ctx.fillStyle = roster[i].accent;
        ctx.font = 'bold 16px Courier New';
        ctx.fillText(roster[i].name, bx + boxWidth/2, by + 45);

        ctx.fillStyle = '#aaa';
        ctx.font = '12px Courier New';
        ctx.fillText(roster[i].desc, bx + boxWidth/2, by + 85);

        ctx.fillStyle = '#fff';
        ctx.font = '11px Courier New';
        ctx.fillText('Modo: Inmortal (999 HP)', bx + boxWidth/2, by + 170);
      }

      ctx.fillStyle = '#ff0055';
      ctx.font = 'bold 14px Courier New';
      ctx.fillText('IZQUIERDA/DERECHA para cambiar | CENTRO para SELECCIONAR', canvas.width / 2, 375);
    }

    function drawGameOverScreen() {
      ctx.fillStyle = 'rgba(10, 10, 18, 0.95)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff0055';
      ctx.font = 'bold 40px Courier New';
      ctx.fillText('GAME OVER', canvas.width / 2, 180);

      ctx.fillStyle = '#fff';
      ctx.font = '16px Courier New';
      ctx.fillText('Haz clic para volver al menú principal', canvas.width / 2, 260);
    }

    function drawVictoryScreen() {
      ctx.fillStyle = 'rgba(10, 10, 18, 0.95)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 40px Courier New';
      ctx.fillText('VICTORIA UNDERGROUND', canvas.width / 2, 180);

      ctx.fillStyle = '#fff';
      ctx.font = '16px Courier New';
      ctx.fillText('¡Has derrotado al EDM! Haz clic para jugar de nuevo', canvas.width / 2, 260);
    }

    function render() {
      try {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (gameState === 'TITLE') {
          drawStageBackground();
          drawTitleScreen();
        } else if (gameState === 'SELECT') {
          drawSelectScreen();
        } else if (gameState === 'PLAYING') {
          update();
          drawStageBackground();

          chests.forEach(function(c) { c.draw(); });
          pickups.forEach(function(p) { p.draw(); });
          enemies.forEach(function(e) { e.draw(); });
          if (player) player.draw();
          projectiles.forEach(function(p) { p.draw(); });

          drawHUD();
        } else if (gameState === 'GAMEOVER') {
          drawGameOverScreen();
        } else if (gameState === 'VICTORY') {
          drawVictoryScreen();
        }
      } catch (err) {
        console.error("Error en render:", err);
      }
      requestAnimationFrame(render);
    }

    window.addEventListener('keydown', function(e) {
      initAudio();
      keys[e.code] = true;

      if (gameState === 'TITLE') {
        if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyJ') {
          gameState = 'SELECT';
        }
      } else if (gameState === 'SELECT') {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
          selectedIndex = (selectedIndex - 1 + roster.length) % roster.length;
          playSound('pickup');
        } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
          selectedIndex = (selectedIndex + 1) % roster.length;
          playSound('pickup');
        } else if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyJ') {
          startActualGame(roster[selectedIndex]);
        }
      }
    });

    window.addEventListener('keyup', function(e) { keys[e.code] = false; });

    var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (isTouchDevice) {
      var tc = document.getElementById('touch-controls');
      if (tc) tc.style.display = 'block';
    }

    function setupTouch(id, code) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('touchstart', function(e) { e.preventDefault(); initAudio(); keys[code] = true; });
      el.addEventListener('touchend', function(e) { e.preventDefault(); keys[code] = false; });
    }
    setupTouch('btn-up', 'KeyW');
    setupTouch('btn-down', 'KeyS');
    setupTouch('btn-left', 'KeyA');
    setupTouch('btn-right', 'KeyD');
    setupTouch('btn-punch', 'KeyJ');
    setupTouch('btn-kick', 'KeyK');
    setupTouch('btn-special', 'KeyL');

    canvas.addEventListener('click', function(e) {
      var rect = canvas.getBoundingClientRect();
      handleScreenClick(e.clientX - rect.left, rect.width);
    });

    canvas.addEventListener('touchend', function(e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      if (e.changedTouches.length > 0) {
        handleScreenClick(e.changedTouches[0].clientX - rect.left, rect.width);
      }
    }, { passive: false });

    render();
  </script>
</body>
</html>
