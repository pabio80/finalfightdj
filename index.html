<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DJ Legends Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; }
    canvas { background: #1a1a2e; border: 4px solid #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.4); max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="800" height="450"></canvas>

  <script>
    window.addEventListener('load', function() {
      var canvas = document.getElementById('gameCanvas');
      var ctx = canvas.getContext('2d');
      var contador = 0;

      function loop() {
        contador++;
        
        // Limpiar pantalla con un color visible
        ctx.fillStyle = '#121220';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Dibujar título parpadeante
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 32px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('DJ LEGENDS: SISTEMA ACTIVO', canvas.width / 2, 120);

        // Dibujar instrucción
        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 20px Courier New';
        ctx.fillText('¡HAZ CLIC O TOCA LA PANTALLA!', canvas.width / 2, 220);

        // Dibujar contador de fotogramas para verificar que el bucle corre
        ctx.fillStyle = '#ffffff';
        ctx.font = '16px Courier New';
        ctx.fillText('Fotogramas: ' + contador, canvas.width / 2, 320);

        requestAnimationFrame(loop);
      }

      canvas.addEventListener('click', function() {
        alert('¡Clic detectado con éxito!');
      });

      canvas.addEventListener('touchend', function(e) {
        e.preventDefault();
        alert('¡Toque móvil detectado con éxito!');
      }, { passive: false });

      loop();
    });
  </script>
</body>
</html>
