<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DJ Legends: Techno vs EDM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #12121a; font-family: 'Courier New', monospace; color: #fff; }
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #1a1a24; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #1a1a28; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    
    #touch-controls { position: absolute; bottom: 10px; left: 0; width: 100%; height: 160px; pointer-events: none; z-index: 50; display: none; }
    .touch-btn { position: absolute; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #fff; font-size: 1.2rem; -webkit-tap-highlight-color: transparent; }
    .touch-btn:active { background: rgba(0,255,204,0.6); border-color: #00ffcc; color: #000; }
    
    #dpad { position: absolute; bottom: 15px; left: 15px; width: 130px; height: 130px; }
    #btn-up { top: 0; left: 45px; width: 40px; height: 40px; }
    #btn-down { bottom: 0; left: 45px; width: 40px; height: 40px; }
    #btn-left { top: 45px; left: 0; width: 40px; height: 40px; }
    #btn-right { top: 45px; right: 0; width: 40px; height: 40px; }
    
    #actions { position: absolute; bottom: 20px; right: 20px; width: 160px; height: 120px; }
    #btn-punch { bottom: 10px; right: 100px; width: 50px; height: 50px; background: rgba(0,255,204,0.3); }
    #btn-kick { bottom: 50px; right: 50px; width: 50px; height: 50px; background: rgba(255,0,85,0.3); }
    #btn-special { bottom: 0px; right: 0px; width: 45px; height: 45px; background: rgba(255,204,0,0.3); font-size: 0.8rem; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div id="touch-controls">
      <div id="dpad">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-left">◄</div>
        <div class="touch-btn" id="btn-right">►</div>
      </div>
      <div id="actions">
        <div class="touch-btn" id="btn-punch">P</div>
        <div class="touch-btn" id="btn-kick">K</div>
        <div class="touch-btn" id="btn-special">SP</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var canvas, ctx;
      var audioCtx = null;
      var bgmInterval = null;
      var gameState = 'TITLE';
      var cameraX = 0;
      var stageWidth = 3600;
      var keys = {};

      var selectedIndex = 0;
      var roster = [
        { name: 'Ricardo Villalobos', color: '#2b2b48', accent: '#00ffcc', desc: 'Minimal Groove' },
        { name: 'Derrick May', color: '#1b3a4b', accent: '#ff0055', desc: 'Detroit Techno' },
        { name: 'Richie Hawtin', color: '#212529', accent: '#ffcc00', desc: 'Acid Overlord' }
      ];

      function initAudio() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx && !audioCtx) {
            audioCtx = new AudioCtx();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        } catch(e){}
      }

      function playSound(type) {
        initAudio();
        if (!audioCtx) return;
        try {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          var t = audioCtx.currentTime;

          if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(30, t + 0.1);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.start(t); osc.stop(t + 0.1);
          } else if (type === 'special') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(90, t);
            osc.frequency.exponentialRampToValueAtTime(600, t + 0.3);
            gain.gain.setValueAtTime(0.4, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
            osc.start(t); osc.stop(t + 0.3);
          } else if (type === 'pickup') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(500, t);
            osc.frequency.setValueAtTime(1000, t + 0.08);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            osc.start(t); osc.stop(t + 0.2);
          }
        } catch(e){}
      }

      function startMusic() {
        initAudio();
        if (bgmInterval || !audioCtx) return;
        var notes = [110, 110, 220, 110, 146.83, 110, 130.81, 110];
        var step = 0;
        bgmInterval = setInterval(function() {
          if (!audioCtx) return;
          try {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            if (player && player.x > 2800) {
              osc.type = 'sawtooth';
              osc.frequency.value = (step % 2 === 0) ? 220 : 440;
              gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            } else {
              osc.type = 'square';
              osc.frequency.value = notes[step % notes.length];
              gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            }
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.1);
            step++;
          } catch(e){}
        }, 130);
      }

      function stopMusic() {
        if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
      }

      var player = null;
      function Player(data) {
        this.name = data.name;
        this.color = data.color;
        this.accent = data.accent;
        this.x = 100; this.y = 340;
        this.hp = 999; this.maxHp = 999;
        this.speed = 3.8; this.power = 25;
        this.facing = 1; this.state = 'idle';
        this.animTimer = 0; this.attackBox = null;
        this.hasHit = false;
        this.invulnerableTimer = 0;
      }

      Player.prototype.update = function() {
        if (this.invulnerableTimer > 0) this.invulnerableTimer--;
